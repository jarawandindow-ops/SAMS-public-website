name: SAMS live website checks
on:
  push:
    paths:
      - .github/workflows/sams-live-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify website, staff portal and enquiry form pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sams-public-website.onrender.com"
          for file in index.html portal.html contact.html get-involved.html privacy.html enquiry-received.html static/portal.js static/live-content.js static/site.css staff-management.html static/staff-management.js static/staff-management.css; do
            code=$(curl --silent --location --retry 4 --retry-delay 5 --max-time 35 --output /dev/null --write-out '%{http_code}' "$BASE/$file")
            echo "$file => HTTP $code"
            test "$code" = "200"
          done
      - name: Verify invitation activation rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 35 --output /dev/null --write-out '%{http_code}' \
            -X POST "https://evnhavenxnxodymshwwp.supabase.co/functions/v1/sams-create-staff-activation" \
            -H "Origin: https://sams-public-website.onrender.com" \
            -H "Content-Type: application/json" \
            --data '{"invitation_id":"00000000-0000-0000-0000-000000000000"}')
          echo "Unsigned activation request => HTTP $code"
          test "$code" = "401" -o "$code" = "403"
